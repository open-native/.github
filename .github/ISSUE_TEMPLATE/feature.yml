name: Feature
description: A new capability for a user
type: Feature
projects: ["open-native/2"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters and for whom. Link the PPS or PRD when there is one.
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As <role>, I want <capability>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One `- [ ]` per line, each checkable by a command or an observation.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue will not do, one `- ` per line.
