name: Debt
description: Refactor or upgrade with no behavior change
type: Debt
projects: ["open-native/2"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is refactored or upgraded, and the cost of leaving it as is.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One `- [ ]` per line, each checkable by a command or an observation. Include how to confirm the behavior did not change.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue will not do, one `- ` per line.
